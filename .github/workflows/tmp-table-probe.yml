name: Temp table probe
on:
  push:
    branches: [claude/project-thread-bdw5lp]
jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Probe NSTableView row geometry
        run: |
          cat > probe.swift <<'SWIFT'
          import AppKit
          final class DS: NSObject, NSTableViewDataSource, NSTableViewDelegate {
              func numberOfRows(in t: NSTableView) -> Int { 3 }
              func tableView(_ t: NSTableView, viewFor c: NSTableColumn?, row: Int) -> NSView? { NSTableCellView() }
          }
          let app = NSApplication.shared
          for style in [NSTableView.Style.automatic, .plain] {
              let ds = DS()
              let w = NSWindow(contentRect: NSRect(x: 0, y: 0, width: 240, height: 200), styleMask: [.titled], backing: .buffered, defer: false)
              let t = NSTableView()
              let col = NSTableColumn(identifier: .init("c"))
              col.resizingMask = .autoresizingMask
              t.addTableColumn(col)
              t.headerView = nil
              if style == .plain { t.style = .plain }
              t.intercellSpacing = NSSize(width: 0, height: 2)
              t.rowHeight = 34
              t.delegate = ds; t.dataSource = ds
              let s = NSScrollView(frame: NSRect(x: 0, y: 0, width: 240, height: 200))
              s.documentView = t
              w.contentView = s
              col.width = 240
              t.frame.size.width = 240
              t.reloadData()
              w.layoutIfNeeded(); t.layoutSubtreeIfNeeded()
              let cell = t.view(atColumn: 0, row: 0, makeIfNecessary: true)!
              let f = cell.convert(cell.bounds, to: s)
              print("style=\(style == .plain ? "plain" : "automatic") effective=\(t.effectiveStyle.rawValue) clip=\(s.contentView.bounds.width) cell.minX=\(f.minX) cell.maxX=\(f.maxX)")
          }
          SWIFT
          swiftc probe.swift -o probe && ./probe
