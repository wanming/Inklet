name: Temporary welcome snapshots

on:
  push:
    branches: [claude/project-thread-k187g8]

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Light
        run: INKLET_LOCALIZATION_SNAPSHOT_DIR="$PWD/shots/light" swift test --filter testWelcomeLanguageStepFitsTheGuideInEveryLanguage
      - name: Dark
        if: always()
        run: INKLET_LOCALIZATION_SNAPSHOT_DIR="$PWD/shots/dark" INKLET_SNAPSHOT_APPEARANCE=dark swift test --filter testWelcomeLanguageStepFitsTheGuideInEveryLanguage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: welcome-shots
          path: shots
