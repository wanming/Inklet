name: Temp grip snapshots

on:
  push:
    branches: [claude/project-thread-6d75sq]

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Record light and dark snapshots
        run: |
          swift build --build-tests
          for appearance in light dark; do
            INKLET_LOCALIZATION_SNAPSHOT_DIR="$PWD/snapshots/$appearance" INKLET_SNAPSHOT_APPEARANCE=$appearance \
              swift test --skip-build --filter 'testSelectionSnapshotsInEveryLanguage|testWelcomeSelectionAndReadyStepsFitTheGuideInEveryLanguage|testTempGripSnapshots'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: grip-snapshots
          path: snapshots
