name: Settings snapshots (temporary)

on:
  push:
    branches: [claude/project-thread-1oh87s]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run unit tests
        run: swift test

  snapshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: After, light
        run: INKLET_LOCALIZATION_SNAPSHOT_DIR="$PWD/out/after-light" swift test --filter "testSettingsSnapshotsUseSyntheticDataInEveryLanguage|testSidebarLabelsFit"
      - name: After, dark
        run: INKLET_SNAPSHOT_APPEARANCE=dark INKLET_LOCALIZATION_SNAPSHOT_DIR="$PWD/out/after-dark" swift test --filter testSettingsSnapshotsUseSyntheticDataInEveryLanguage
      - name: Before, light and dark
        run: |
          git worktree add ../before origin/main
          cp Tests/InkletCoreTests/LocalizationSnapshot.swift ../before/Tests/InkletCoreTests/
          cd ../before
          INKLET_LOCALIZATION_SNAPSHOT_DIR="$GITHUB_WORKSPACE/out/before-light" swift test --filter testSettingsSnapshotsUseSyntheticDataInEveryLanguage
          INKLET_SNAPSHOT_APPEARANCE=dark INKLET_LOCALIZATION_SNAPSHOT_DIR="$GITHUB_WORKSPACE/out/before-dark" swift test --filter testSettingsSnapshotsUseSyntheticDataInEveryLanguage
      - name: Keep English and Chinese
        if: always()
        run: find out -name '*.png' ! -name '*-en.png' ! -name '*-zh-Hans.png' -delete; find out -name '*.json' -delete; ls -R out | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-snapshots
          path: out
